version: 2

updates:
 - package-ecosystem: "npm"
   directory: "/"
   schedule:
      interval: "weekly"
   open-pull-requests-limit: 10
     


 - package-ecosystem: "github-actions"
   directory: ".github/workflows"
   schedule:
     interval: "weekly"
   groups:
     Actions-dependencies:
       patterns:
         - "*"
   open-pull-requests-limit: 10

 - package-ecosystem: "docker"
   directory: "/"
   schedule:
     interval: "weekly"
   groups:
     Docker-dependencies:
       patterns:
         - "*"
   open-pull-requests-limit: 10
