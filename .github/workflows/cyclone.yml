name: cyclone 
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    name: Install and build javascript
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '20'
      - run: npm install
      - name: Create SBOM with CycloneDX
        uses: CycloneDX/gh-node-module-generatebom@v1
        with: 
          output: './app.bom.xml'
      - name: Send SBOM artifact
        run: |
          curl -X 'POST' \
            -k \
            "${{ secrets.CONCERT_URL }}/ingestion/api/v1/upload_files" \
            -H 'accept: application/json' \
            -H "InstanceID: 0000-0000-0000-0000" \
            -H "Authorization: Bearer ${{ secrets.CONCERT }}" \
            -H 'Content-Type: multipart/form-data' \
            -F "data_type=package_sbom" \
            -F "filename=@app.bom.xml"
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v3
        with:
          name: sbom
          path: ./app.bom.xml
