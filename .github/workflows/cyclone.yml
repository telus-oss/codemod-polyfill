name: cyclone 

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  cyclonedx:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'  # Adjust node version as necessary

      - name: Install dependencies
        run: npm install

      - name: Install CycloneDX JavaScript Library
        run: npm install @cyclonedx/cyclonedx-library

      - name: Generate CycloneDX SBOM in JSON
        run: |
          npx cyclonedx-bom -o sbom.json 
      - name: Generate Vulnerability Report
        run: npx audit-ci --report-type full --output-format json > vdr.json


      - name: Upload CycloneDX SBOM artifact
        uses: actions/upload-artifact@v3
        with:
          name: sbom
          path: sbom.json



      - name: Upload Vulnerability Report
        uses: actions/upload-artifact@v3
        with:
          name: vdr
          path: vdr.json
      - name: Send SBOM artifact
        run: |
          curl -X 'POST' \
            -k \
            "${{ secrets.CONCERT_URL }}/ingestion/api/v1/upload_files" \
            -H 'accept: application/json' \
            -H "InstanceID: 0000-0000-0000-0000" \
            -H "Authorization: Bearer ${{ secrets.CONCERT }}" \
            -H 'Content-Type: multipart/form-data' \
            -F "data_type=package_sbom" \
            -F "filename=@sbom.json"

